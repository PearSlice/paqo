name: CI — Build & Push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'terraform/**'
      - '**.md'

env:
  # Oracle Container Image Registry
  OCIR_REGION: ${{ secrets.OCIR_REGION }}           # e.g. fra.ocir.io
  OCIR_NAMESPACE: ${{ secrets.OCIR_NAMESPACE }}     # your tenancy namespace
  IMAGE_NAME: quarkus-service
  JAVA_VERSION: '21'

jobs:
  # ─── Test ──────────────────────────────────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: ./mvnw verify
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/testdb
          QUARKUS_DATASOURCE_USERNAME: testuser
          QUARKUS_DATASOURCE_PASSWORD: testpassword
          QUARKUS_HIBERNATE_ORM_DATABASE_GENERATION: drop-and-create

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  # ─── Build native image ────────────────────────────────────────────────────
  build:
    name: Build Native Image (ARM64)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Set up QEMU (for ARM64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGION }}
          username: ${{ secrets.OCIR_USERNAME }}   # <tenancy-namespace>/<username>
          password: ${{ secrets.OCIR_TOKEN }}      # OCI Auth Token

      - name: Generate image tags
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image=${{ env.OCIR_REGION }}/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Build native image for ARM64
        run: |
          ./mvnw package -Pnative -DskipTests \
            -Dquarkus.native.container-build=true \
            -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21 \
            -Dquarkus.native.container-runtime-options="--platform linux/arm64"

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/main/docker/Dockerfile.native
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest
        run: echo "Pushed ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}"
