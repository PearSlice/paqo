name: Terraform

on:
  push:
    branches: [main]
    paths: ['terraform/**']
  pull_request:
    branches: [main]
    paths: ['terraform/**']
  workflow_dispatch:  # allow manual trigger

env:
  TF_VERSION: '1.8.0'
  WORKING_DIR: terraform
  TF_LOG: INFO

jobs:
  terraform:
    name: ${{ github.event_name == 'pull_request' && 'Plan' || 'Apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Write OCI API key
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_API_KEY_PEM }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Write SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_PUBLIC_KEY }}"  > ~/.ssh/oci_quarkus.pub
          echo "${{ secrets.OCI_SSH_PRIVATE_KEY }}" > ~/.ssh/oci_quarkus
          chmod 600 ~/.ssh/oci_quarkus

      - name: Terraform Init
        run: terraform init
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OCI_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OCI_S3_SECRET_KEY }}
        run: |
          terraform plan -no-color -out=tfplan \
            -var="tenancy_ocid=${{ secrets.TF_TENANCY_OCID }}" \
            -var="user_ocid=${{ secrets.TF_USER_OCID }}" \
            -var="fingerprint=${{ secrets.TF_FINGERPRINT }}" \
            -var="private_key_path=$HOME/.oci/oci_api_key.pem" \
            -var="region=${{ secrets.TF_REGION }}" \
            -var="ssh_public_key_path=$HOME/.ssh/oci_quarkus.pub" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="gh_token=${{ secrets.GH_TOKEN }}" \
            -var="gh_owner=${{ github.repository_owner }}" \
            -var="gh_repo=${{ github.event.repository.name }}" \
            -var="ocir_region=${{ secrets.OCIR_REGION }}" \
            -var="ocir_username=${{ secrets.OCIR_USERNAME }}" \
            -var="ocir_token=${{ secrets.OCIR_TOKEN }}"

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -auto-approve tfplan

      - name: Print outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform output
